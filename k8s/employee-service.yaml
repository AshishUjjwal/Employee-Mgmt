apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
      - name: employee-service
        image: ashishujjwal/employee:latest
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-server:3306/employee_db?createDatabaseIfNotExist=true"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms128m"
        - name: EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS
          value: "60"
        - name: EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS
          value: "60"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  selector:
    app: employee-service
  ports:
    - port: 8081
      targetPort: 8081
