apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ashishujjwal/apigateway:latest
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms128m"
        - name: EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS
          value: "60"
        - name: EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS
          value: "60"
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30002
  type: NodePort
