version: '3.8'

networks:
  employee-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1350

services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    networks:
      - employee-net
    environment:
      MYSQL_ROOT_PASSWORD: Root@1234
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot@1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./EurekaServer
    container_name: eureka-server
    networks:
      - employee-net
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m

  api-gateway:
    build: ./ApiGateway
    container_name: api-gateway
    networks:
      - employee-net
    restart: on-failure
    ports:
      - "9090:9090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS=60
      - EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS=60
    depends_on:
      - eureka-server

  auth-service:
    build: ./AuthService
    container_name: auth-service
    networks:
      - employee-net
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/auth_db?createDatabaseIfNotExist=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS=60
      - EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS=60
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  employee-service:
    build: ./Employee
    container_name: employee-service
    networks:
      - employee-net
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/employee_db?createDatabaseIfNotExist=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS=60
      - EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS=60
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  address-service:
    build: ./Address
    container_name: address-service
    networks:
      - employee-net
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/address_db?createDatabaseIfNotExist=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - EUREKA_CLIENT_EUREKASERVER_CONNECTTIMEOUTSECONDS=60
      - EUREKA_CLIENT_EUREKASERVER_READTIMEOUTSECONDS=60
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
